<title>E! Support Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: grey wireframe. Prototype strip + app bar span the width; content sits in a 1240px column.
   Form and report details use a main column with a side column that stacks below ~1000px. */
:root {
  --bg: #ececee;
  --surface: #ffffff;
  --sunken: #f5f5f6;
  --line: #c4c6cb;
  --line-2: #8a8d94;
  --ink: #1c1d21;
  --ink-2: #44464c;
  --muted: #5b5e65;
  --primary: #222429;
  --on-primary: #ffffff;
  --note: #e3e4e7;
  --hatch: #dcdde0;
  --proto: #fafafa;
  --overlay: rgba(18, 19, 22, .5);
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161719; --surface: #202125; --sunken: #1a1b1e; --line: #44474d; --line-2: #7d8088;
    --ink: #ececee; --ink-2: #c6c8cc; --muted: #a8abb1; --primary: #e8e9eb; --on-primary: #17181b;
    --note: #2c2e33; --hatch: #33353a; --proto: #1c1d20; --overlay: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161719; --surface: #202125; --sunken: #1a1b1e; --line: #44474d; --line-2: #7d8088;
  --ink: #ececee; --ink-2: #c6c8cc; --muted: #a8abb1; --primary: #e8e9eb; --on-primary: #17181b;
  --note: #2c2e33; --hatch: #33353a; --proto: #1c1d20; --overlay: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .95rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--ink); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-size: .85em; letter-spacing: .01em; }
.muted { color: var(--muted); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Buttons: one primary per screen, secondary outlined, tertiary text only */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 40px; padding: .5rem 1rem; border-radius: var(--r); border: 1.5px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn-primary:hover { filter: brightness(1.25); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--ink-2); }
.btn-secondary:hover { background: var(--sunken); }
.btn-tertiary { background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; padding-inline: .35rem; min-height: 36px; }
.btn-tertiary:hover { text-decoration-thickness: 2px; }
.btn-sm { min-height: 34px; padding: .3rem .7rem; font-size: .875rem; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }

/* Prototype strip */
.proto { background: var(--proto); border-bottom: 1.5px dashed var(--line-2); font-size: .875rem; }
.proto-inner { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-block: .5rem; }
.proto-tag { font-family: var(--f-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; border: 1px dashed var(--line-2); padding: .15rem .45rem; border-radius: 3px; color: var(--ink-2); }
.seg { display: inline-flex; align-items: center; gap: .4rem; }
.seg-btns { display: inline-flex; border: 1.5px solid var(--ink-2); border-radius: var(--r); overflow: hidden; }
.seg-btns button { border: 0; background: var(--surface); padding: .25rem .6rem; min-height: 32px; cursor: pointer; font-weight: 600; }
.seg-btns button + button { border-left: 1.5px solid var(--ink-2); }
.seg-btns button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: 10px; border: 1.5px solid var(--ink-2); background: var(--surface); position: relative; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--ink-2); transition: left .15s; }
.switch input:checked { background: var(--ink); border-color: var(--ink); }
.switch input:checked::after { left: 18px; background: var(--surface); }
.switch-state { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.proto-spacer { flex: 1; }

/* App bar */
.appbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.appbar-inner { display: flex; align-items: center; gap: 1rem; min-height: 60px; }
.logo { font-weight: 800; font-size: 1.35rem; text-decoration: none; border: 2px solid var(--ink); border-radius: 4px; padding: 0 .4rem; line-height: 1.5; }
.appnav { display: flex; gap: .25rem; }
.appnav a { text-decoration: none; padding: .4rem .6rem; border-radius: var(--r); color: var(--ink-2); font-weight: 500; }
.appnav a[aria-current="page"] { color: var(--ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--ink); border-radius: 0; }
.spacer { flex: 1; }
.iconbtn { position: relative; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; }
.iconbtn svg { width: 20px; height: 20px; }
.count-badge { position: absolute; top: -4px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 5px; background: var(--ink); color: var(--surface); font-size: .72rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.me { display: flex; align-items: center; gap: .55rem; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--note); border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 700; font-size: .78rem; flex: none; }
.me-text { display: flex; flex-direction: column; line-height: 1.2; }
.me-text small { color: var(--muted); font-size: .78rem; }

/* Menus and popovers */
.menu-wrap { position: relative; display: inline-block; }
.menu, .popover { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; min-width: 260px; max-width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1.5px solid var(--ink-2); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: .35rem; }
.menu.right, .popover.right { left: auto; right: 0; }
.menu-item { display: flex; width: 100%; text-align: left; gap: .6rem; align-items: flex-start; border: 0; background: none; padding: .55rem .6rem; border-radius: 4px; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--sunken); }
.menu-item .check { width: 1.1em; flex: none; font-weight: 700; }
.menu-item small { display: block; color: var(--muted); font-size: .8rem; }
.menu-sep { height: 0; border-top: 1.5px solid var(--line); margin: .35rem .2rem; }
.menu-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: .35rem .6rem .15rem; font-weight: 600; }
.popover { width: 360px; padding: 0; }
.pop-head { display: flex; justify-content: space-between; align-items: center; padding: .6rem .8rem; border-bottom: 1px solid var(--line); gap: .5rem; }
.pop-list { list-style: none; margin: 0; padding: .3rem; max-height: 60vh; overflow: auto; }
.notif { display: grid; grid-template-columns: 12px 1fr; gap: .5rem; width: 100%; text-align: left; border: 0; background: none; padding: .6rem; border-radius: 4px; cursor: pointer; }
.notif:hover, .notif:focus-visible { background: var(--sunken); }
.notif .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: .4rem; border: 1.5px solid var(--ink-2); }
.notif.unread .dot { background: var(--ink); border-color: var(--ink); }
.notif.unread b { font-weight: 700; }
.notif b { font-weight: 500; display: block; }
.notif small { color: var(--muted); }

/* Page */
.page { padding-block: 1.75rem 4rem; }
.crumbs { font-size: .875rem; color: var(--muted); margin-bottom: .75rem; display: flex; gap: .4rem; flex-wrap: wrap; }
.crumbs a { color: var(--ink-2); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
.lede { color: var(--muted); margin-top: .3rem; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .75rem 1.25rem; padding: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.filters .field { flex: 1 1 260px; max-width: 420px; }
.toggle { display: inline-flex; border: 1.5px solid var(--ink-2); border-radius: var(--r); overflow: hidden; }
.toggle label { position: relative; padding: .45rem .9rem; cursor: pointer; font-weight: 600; min-height: 40px; display: inline-flex; align-items: center; gap: .35rem; background: var(--surface); }
.toggle label + label { border-left: 1.5px solid var(--ink-2); }
.toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.toggle label:has(input:checked) { background: var(--ink); color: var(--surface); }
.toggle label:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; z-index: 1; }
.fieldset-plain { border: 0; padding: 0; margin: 0; min-width: 0; }
.fieldset-plain legend { font-weight: 600; font-size: .875rem; margin-bottom: .35rem; padding: 0; }
.check { display: inline-flex; align-items: center; gap: .45rem; cursor: pointer; min-height: 40px; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.result-line { margin: 1rem 0 .6rem; color: var(--muted); font-size: .875rem; }

/* Report cards */
.cards { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.25rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1.1rem; }
.card:hover { border-color: var(--ink-2); }
.card:has(a:focus-visible) { outline: 3px solid var(--ink); outline-offset: 2px; }
.card-title a { text-decoration: none; }
.card-title a::after { content: ""; position: absolute; inset: 0; }
.card-title a:focus-visible { outline: none; }
.card-title { font-size: 1rem; }
.meta { display: flex; flex-wrap: wrap; gap: .15rem .9rem; color: var(--muted); font-size: .85rem; margin-top: .3rem; }
.meta > * + *::before { content: "·"; margin-right: .9rem; color: var(--line-2); }
.card-side { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: flex-end; }
.status { display: inline-flex; align-items: baseline; gap: .3rem; border: 1.5px solid var(--ink-2); border-radius: 999px; padding: .15rem .65rem; font-size: .84rem; white-space: nowrap; background: var(--surface); }
.status .k { color: var(--muted); }
.status b { font-weight: 650; }
.status.closed { background: var(--note); border-style: dashed; }
.badge-na { display: inline-flex; align-items: center; gap: .35rem; background: var(--ink); color: var(--surface); border-radius: 4px; padding: .18rem .55rem; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.badge-na::before { content: "!"; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .7rem; line-height: 1; }
.empty { background: var(--surface); border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 2rem 1rem; text-align: center; display: grid; gap: .5rem; justify-items: center; }

/* Fields */
.field { display: grid; gap: .3rem; min-width: 0; }
.label-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.field label, .label { font-weight: 600; font-size: .9rem; }
.req { font-weight: 700; }
input[type="text"], input[type="search"], textarea, select { width: 100%; border: 1.5px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding: .55rem .7rem; min-height: 42px; }
textarea { resize: vertical; min-height: 84px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
.msg { font-size: .85rem; display: flex; gap: .4rem; }
.msg.hint { color: var(--ink-2); }
.msg.hint::before { content: "i"; flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .68rem; font-weight: 700; font-style: italic; margin-top: .1rem; }
.msg.err { color: var(--ink); font-weight: 600; }
.msg.err::before { content: "!"; flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 3px; background: var(--ink); color: var(--surface); font-size: .7rem; font-weight: 800; margin-top: .1rem; }
.field.has-err input, .field.has-err textarea, .field.has-err select { border-color: var(--ink); border-width: 2.5px; }
.ai-tag { font-family: var(--f-mono); font-size: .72rem; border: 1px solid var(--ink-2); border-radius: 3px; padding: .05rem .4rem; color: var(--ink-2); background: var(--sunken); }
.ai-tag::before { content: "✦ "; }

/* Form layout */
.form-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 1.5rem; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; }
.form-col { display: grid; gap: 1.15rem; }
.tech-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
fieldset.group { border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem 1rem; margin: 0; min-width: 0; display: grid; gap: .75rem; }
fieldset.group legend { font-weight: 650; padding: 0 .35rem; }
.warn { display: flex; gap: .5rem; align-items: flex-start; font-weight: 600; font-size: .9rem; }
.warn::before { content: "!"; flex: none; display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 3px; font-weight: 800; font-size: .75rem; margin-top: .05rem; }
.drop { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 1.1rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .5rem .75rem; text-align: center; background: var(--sunken); }
.drop.over { border-color: var(--ink); background: var(--note); }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.file { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: .75rem; align-items: center; border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .6rem; background: var(--surface); }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-actions { display: flex; gap: .25rem .75rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.thumb { width: 44px; height: 44px; border: 1px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; font-family: var(--f-mono); font-size: .66rem; font-weight: 600; background: repeating-linear-gradient(45deg, var(--sunken) 0 6px, var(--hatch) 6px 7px); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.conf-tag { font-size: .75rem; font-weight: 700; border: 1.5px solid var(--ink); border-radius: 3px; padding: .02rem .35rem; text-transform: uppercase; letter-spacing: .05em; }
.proto-box { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: .5rem .7rem; font-size: .85rem; display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .5rem; background: var(--proto); }
.proto-box .proto-tag { font-size: .68rem; }
.form-actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; padding-top: .25rem; }

/* Chat */
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; position: sticky; top: 16px; max-height: calc(100vh - 32px); }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
.chat-head .mono { color: var(--muted); font-size: .72rem; }
.chat-warn { margin: .75rem 1rem 0; padding: .6rem .7rem; border: 1.5px solid var(--ink); border-radius: var(--r); }
.chat-log { flex: 1; overflow: auto; padding: .9rem 1rem; display: grid; gap: .75rem; align-content: start; min-height: 220px; }
.bubble { max-width: 92%; padding: .55rem .75rem; border-radius: 10px; border: 1px solid var(--line); background: var(--sunken); font-size: .92rem; }
.bubble .who { display: block; font-size: .72rem; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .15rem; }
.bubble.user { justify-self: end; background: var(--note); border-color: var(--line-2); }
.sug { border: 1.5px solid var(--ink-2); border-radius: var(--r); background: var(--surface); padding: .6rem .7rem; margin-top: .5rem; display: grid; gap: .55rem; }
.sug-field { display: grid; gap: .1rem; }
.sug-label { font-size: .75rem; font-weight: 650; color: var(--muted); }
.sug-text { white-space: pre-line; }
.sug-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
.sug-done { font-size: .85rem; font-weight: 600; display: flex; gap: .35rem; align-items: center; }
.sug-done::before { content: "✓"; }
.typing { color: var(--muted); font-style: italic; font-size: .9rem; }
.chat-input { border-top: 1px solid var(--line); padding: .75rem 1rem 1rem; display: grid; gap: .45rem; }
.chat-input-actions { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
.chat-off { margin: 1rem; padding: 1rem; border: 1.5px dashed var(--line-2); border-radius: var(--r); display: grid; gap: .3rem; }
.chat-toggle { display: none; }
.chat-body-flex { display: flex; flex-direction: column; min-height: 0; flex: 1; }

/* Details */
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.detail-head .id { font-family: var(--f-mono); color: var(--muted); font-size: .85rem; margin-bottom: .25rem; }
.head-status { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.status-btn { min-width: 210px; justify-content: space-between; }
.banner { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; border: 1.5px solid var(--ink); border-radius: var(--r); padding: .75rem 1rem; margin-bottom: 1rem; background: var(--surface); }
.banner.soft { border-style: dashed; border-color: var(--line-2); }
.banner p { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.resolution { border: 1.5px solid var(--ink-2); background: var(--note); border-radius: var(--r); padding: .9rem 1rem; margin-bottom: 1rem; display: grid; gap: .3rem; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 1.5rem; align-items: start; }
.detail-main, .detail-side { display: grid; gap: 1.25rem; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem 1rem; flex-wrap: wrap; margin-bottom: .9rem; }
.translate { display: inline-flex; align-items: center; gap: .1rem; font-size: .9rem; }
.translate label { font-weight: 600; }
.select-text { border: 0; background: transparent; padding: .25rem 1.4rem .25rem .3rem; min-height: 34px; width: auto; field-sizing: content; max-width: 14rem; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.select-text:focus-visible { outline: 3px solid var(--ink); }
.dl { display: grid; gap: 1rem; margin: 0; }
.dl dt { font-weight: 650; font-size: .85rem; color: var(--ink-2); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .2rem; }
.dl dd { margin: 0; white-space: pre-line; }
.tr-note { font-size: .8rem; color: var(--muted); font-style: italic; margin-top: -.4rem; }
.side-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .35rem .9rem; margin: 0; font-size: .9rem; }
.side-dl dt { color: var(--muted); }
.side-dl dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { position: relative; padding: 0 0 .9rem 1.4rem; font-size: .9rem; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: .45rem; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink-2); background: var(--surface); }
.timeline li::after { content: ""; position: absolute; left: 8.5px; top: 1.1rem; bottom: 0; border-left: 1.5px solid var(--line); }

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const endDot = s => /[.!?]$/.test(s) ? s : s + '.';
function scrub(text) {
  let found = false;
  const out = text.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, () => { found = true; return '[…]'; })
                  .replace(/\+?\d[\d ()\/-]{7,}\d/g, () => { found = true; return '[…]'; });
  return { out, found };
}
function makeTitle(text) {
  let s = text.split(/(?<=[.!?])\s/)[0].replace(/[.!?]+$/, '').trim();
  s = s.replace(/^(the|when|i think|hi,?|hello,?|der|die|das)\s+/i, '');
  const parts = s.split(/\s+(?:when|if|after|because|while|wenn|nachdem|weil|sobald|sobald)\s+/i);
  if (parts[0].length >= 12) s = parts[0];
  s = s.replace(/,$/, '');
  if (s.length > 70) s = s.slice(0, 70).replace(/\s+\S*$/, '') + '…';
  return cap(s);
}
function makeSteps(text) {
  return text.split(/\s*(?:,|;|\n|\bthen\b|\band then\b|\bdann\b)\s*/i).map(x => x.trim()).filter(Boolean).map((x, i) => `${i + 1}. ${cap(x.replace(/\.$/, ''))}`).join('\n');
}
function makeTech(text) {
  const dev = text.match(/(windows[- ]?(laptop|pc)|macbook( pro| air)?|imac|mac|ipad|iphone|android[\w ]*|chromebook|laptop|pc|tablet)/i);
  const br = text.match(/(chrome|edge|firefox|safari|opera)\s*\d*/i);
  const ver = text.match(/\b\d+\.\d+(?:\.\d+)?\b/);
  const f = {};
  if (dev) f.device = cap(dev[0].trim());
  if (br) f.browser = cap(br[0].trim());
  if (ver) f.version = ver[0];
  if (!Object.keys(f).length) f.device = text.trim();
  return f;
}
function nextStep(after) {
  const order = ['describe', 'steps', 'expected', 'tech'];
  const need = { steps: ['steps'], expected: ['expected'], tech: ['device', 'browser', 'version'] };
  for (const s of ['steps', 'expected', 'tech']) {
    if (order.indexOf(s) <= order.indexOf(after)) continue;
    if (need[s].every(f => !state.draft[f])) return s;
  }
  return 'done';
}
function chatSend() {
  const c = state.chat; const text = c.input.trim();
  if (!text || c.typing || state.aiOff) return;
  c.messages.push({ from: 'user', text }); c.input = ''; c.typing = true; chatScroll = true; render();
  setTimeout(() => {
    const { out, found } = scrub(text);
    const step = c.step; const add = [];
    if (found) add.push({ from: 'ai', key: 'piiRemoved' });
    if (step === 'describe') add.push({ from: 'ai', key: 'sug_title_desc', suggestion: { fields: { title: makeTitle(out), desc: endDot(cap(out)) }, state: 'pending' } });
    else if (step === 'steps') add.push({ from: 'ai', key: 'sug_steps', suggestion: { fields: { steps: makeSteps(out) }, state: 'pending' } });
    else if (step === 'expected') add.push({ from: 'ai', key: 'sug_expected', suggestion: { fields: { expected: endDot(cap(out)) }, state: 'pending' } });
    else if (step === 'tech') add.push({ from: 'ai', key: 'sug_tech', suggestion: { fields: makeTech(out), state: 'pending' } });
    else add.push({ from: 'ai', key: 'generic' });
    if (step !== 'done') { const n = nextStep(step); c.step = n; add.push({ from: 'ai', key: n === 'done' ? 'done' : 'ask_' + n }); }
    c.messages.push(...add); c.typing = false; chatScroll = true; render();
  }, 750);
}

let chatScroll = false; let focusAfter = null; let scrollTop = false;
function render() {
  const ae = document.activeElement; const aid = ae && ae.id; let sel = null;
  if (aid && ae && typeof ae.selectionStart === 'number') { try { sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; } }
  const log = document.getElementById('chat-log'); const logTop = log ? log.scrollTop : 0;
  document.documentElement.lang = state.lang === 'de' ? 'de' : 'en-GB';
  let main;
  if (state.view === 'form') main = viewForm();
  else if (state.view === 'report') main = viewReport();
  else if (state.view === 'success') main = viewSuccess();
  else main = viewList();
  app.innerHTML = viewChrome() + main + viewModal();
  const nlog = document.getElementById('chat-log');
  if (nlog) nlog.scrollTop = chatScroll ? nlog.scrollHeight : logTop;
  chatScroll = false;
  if (scrollTop) { window.scrollTo(0, 0); scrollTop = false; }
  let target = null;
  if (focusAfter) { target = typeof focusAfter === 'string' ? document.querySelector(focusAfter) : null; focusAfter = null; }
  else if (state.modal && !(aid && document.getElementById(aid) && document.getElementById(aid).closest('.modal'))) target = document.querySelector('.modal [data-autofocus]') || document.querySelector('.modal button');
  else if (aid) target = document.getElementById(aid);
  if (target) {
    target.focus({ preventScroll: true });
    if (sel && target.id === aid && target.setSelectionRange) { try { target.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
}

function addFiles(list) {
  const d = state.draft; const bad = [];
  Array.from(list).forEach(f => {
    const kind = fileKind(f);
    if (!kind) { bad.push(f.name); return; }
    d.files.push({ id: uid(), name: f.name, size: f.size, kind, confidential: false, url: kind === 'image' && f instanceof Blob ? URL.createObjectURL(f) : null });
  });
  d.fileErr = bad.length ? bad.map(n => t('fileErr', { name: n })).join(' ') : '';
  render();
}

  else if (kind === 'word') addFiles([{ name: 'steps-notes.docx', type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', size: 64000 }]);
  else {
    let url = null;
    try { const cv = document.createElement('canvas'); cv.width = 88; cv.height = 88; const x = cv.getContext('2d');
      x.fillStyle = '#f2f2f3'; x.fillRect(0, 0, 88, 88); x.fillStyle = '#b9bbc0'; x.fillRect(8, 8, 72, 12); x.fillRect(8, 28, 50, 8); x.fillRect(8, 42, 64, 8); x.fillStyle = '#7d8088'; x.fillRect(8, 60, 30, 18);
      url = cv.toDataURL(); } catch (e) {}
    const d = state.draft; d.files.push({ id: uid(), name: 'screenshot.png', size: 248000, kind: 'image', confidential: false, url }); d.fileErr = ''; render();
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (state.menu && !e.target.closest('.menu-wrap')) { state.menu = null; if (!el) { render(); return; } }
  if (e.target.matches('[data-overlay]')) { state.modal = null; render(); return; }
  if (!el || el.matches('input, select')) return;
  const a = el.dataset.action;
  if (el.tagName === 'A' && a !== 'goto') e.preventDefault();
  const r = getReport(state.reportId);
  switch (a) {
    case 'noop': break;
    case 'home': state.respondTo = null; go('list'); break;
    case 'toggle-menu': { const m = el.dataset.menu; state.menu = state.menu === m ? null : m;
      focusAfter = state.menu ? (m === 'bell' ? '.popover button, .popover h2' : '.menu [aria-checked="true"], .menu .menu-item') : '#' + el.id; render(); break; }
    case 'set-role': setRole(el.dataset.role); break;
    case 'set-lang': state.lang = el.dataset.lang; focusAfter = '#lang-' + state.lang; render(); break;
    case 'open-journeys': state.menu = null; state.modal = { type: 'journeys', ret: '#btn-journeys' }; render(); break;
    case 'journey': startJourney(el.dataset.j); break;
    case 'reset': { const keep = { lang: state.lang, role: state.role, aiOff: state.aiOff }; initState(keep); go('list'); toast(t('resetDone')); break; }
    case 'mark-read': myNotifs().forEach(n => { if (!n.read.includes(meId())) n.read.push(meId()); }); focusAfter = '#btn-bell'; state.menu = null; render(); break;
    case 'open-notif': { const n = state.notifs.find(x => x.id === el.dataset.id); if (n && !n.read.includes(meId())) n.read.push(meId()); openReport(n.report); break; }
    case 'new-report': go('form'); break;
    case 'open': e.preventDefault(); openReport(el.dataset.id); break;
    case 'clear-filters': state.search = ''; state.listMode = 'all'; state.followUp = false; focusAfter = '#q'; render(); break;
    case 'close-modal': { const ret = state.modal && state.modal.ret; state.modal = null; focusAfter = ret || null; render(); break; }
    // form
    case 'remove-file': state.draft.files = state.draft.files.filter(f => f.id !== el.dataset.id); focusAfter = '#file-in'; render(); break;
    case 'sample-file': sampleFile(el.dataset.kind); break;
    case 'toggle-chat': state.chat.collapsed = !state.chat.collapsed; render(); break;
    case 'chat-example': { const s = state.chat.step; state.chat.input = EXAMPLES[state.lang][s] || EXAMPLES[state.lang].done; focusAfter = '#chat-in'; render(); break; }
    case 'sug-edit': state.chat.messages[+el.dataset.i].suggestion.state = 'editing'; focusAfter = `[id^="sug-${el.dataset.i}-"]`; render(); break;
    case 'sug-cancel': state.chat.messages[+el.dataset.i].suggestion.state = 'pending'; focusAfter = `#sug-add-${el.dataset.i}`; render(); break;
    case 'sug-add': {
      const i = +el.dataset.i; const sg = state.chat.messages[i].suggestion;
      Object.keys(sg.fields).forEach(k => {
        const ta = document.getElementById(`sug-${i}-${k}`); if (ta) sg.fields[k] = ta.value;
        const v = sg.fields[k].trim(); if (!v) return;
        state.draft[k] = v; state.draft.ai[k] = true; delete state.draft.errors[k];
      });
      sg.state = 'added'; focusAfter = '#chat-in'; render(); toast(t('addedToast')); break; }
    case 'goto-field': { const f = el.dataset.field; state.modal = null; render(); const inp = document.getElementById('f-' + f); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus({ preventScroll: true }); } break; }
    case 'send-report': sendReport(); break;
    // details
    case 'goto': { e.preventDefault(); const tg = document.getElementById(el.dataset.target); if (tg) { tg.scrollIntoView({ block: 'center', behavior: 'smooth' }); tg.setAttribute('tabindex', '-1'); tg.focus({ preventScroll: true }); } break; }
    case 'respond': state.respondTo = el.dataset.id; state.respondText = ''; state.respondErr = ''; focusAfter = '#resp-in'; render(); break;
    case 'respond-cancel': { const id = state.respondTo; state.respondTo = null; focusAfter = '#btn-respond-' + id; render(); break; }
    case 'composer-tab': state.composer.tab = el.dataset.tab; state.composer.err = ''; focusAfter = '#tab-' + el.dataset.tab; render(); break;
    case 'pick-status': {
      const s = el.dataset.status; state.menu = null;
      if (s === r.status) { focusAfter = '#btn-status'; render(); break; }
      if (isClosed(s)) { state.modal = { type: 'close', status: s, text: '', original: '', errors: {}, ret: '#btn-status' }; render(); }
      else { setStatus(r, s); focusAfter = '#btn-status'; render(); }
      break; }
    case 'save-close': {
      const m = state.modal; m.errors = {};
      if (!m.text.trim()) m.errors.text = true;
      if (m.status === 'duplicate' && !m.original) m.errors.original = true;
      if (Object.keys(m.errors).length) { m.errors.any = true; focusAfter = m.errors.text ? '#cl-text' : '#cl-orig'; render(); break; }
      setStatus(r, m.status, m.text.trim(), m.original || null); state.modal = null; focusAfter = '#btn-status'; render(); break; }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target; const kind = f.dataset.submit; const r = getReport(state.reportId);
  if (kind === 'report') {
    if (!validateDraft()) { render(); const first = document.querySelector('.field.has-err input, .field.has-err textarea'); if (first) { first.scrollIntoView({ block: 'center' }); first.focus({ preventScroll: true }); } return; }
    state.modal = { type: 'before', ret: '#btn-submit' }; render();
  } else if (kind === 'chat') chatSend();
  else if (kind === 'comment') {
    const txt = state.comment.trim();
    if (!txt) { state.commentErr = t('errComment'); focusAfter = '#comment-in'; render(); return; }
    r.activity.push({ id: uid(), type: 'comment', author: meId(), at: now(), text: txt });
    notify(['sam'], { type: 'comment', report: r.id, who: meId() });
    state.comment = ''; state.commentErr = ''; focusAfter = '#comment-in'; render(); toast(t('posted'));
  } else if (kind === 'respond') {
    const txt = state.respondText.trim();
    if (!txt) { state.respondErr = t('errResponse'); focusAfter = '#resp-in'; render(); return; }
    const q = r.activity.find(a => a.id === f.dataset.id); q.open = false;
    const id = uid();
    r.activity.push({ id, type: 'response', author: meId(), at: now(), replyTo: q.id, text: txt });
    notify(['sam'], { type: 'response', report: r.id, who: meId() });
    state.respondTo = null; state.respondText = ''; state.respondErr = ''; focusAfter = '#act-' + id; render(); toast(t('responded'));
  } else if (kind === 'composer') {
    const c = state.composer; const txt = c.text.trim();
    if (!txt) { c.err = t('errComment'); focusAfter = '#composer-in'; render(); return; }
    const internal = c.tab === 'internal'; const asQ = !internal && c.question;
    r.activity.push({ id: uid(), type: internal ? 'note' : asQ ? 'question' : 'comment', author: 'sam', at: now(), text: txt, open: asQ ? true : undefined });
    if (asQ) notify(clientAudience(r), { type: 'question', report: r.id, who: 'sam' });
    else if (!internal) notify(clientAudience(r), { type: 'comment', report: r.id, who: 'sam' });
    state.composer = { tab: c.tab, text: '', question: false, err: '' }; focusAfter = '#composer-in'; render();
    toast(internal ? t('notePosted') : asQ ? t('qPosted') : t('posted'));
  }
});

function setPath(path, value) { const parts = path.split('.'); let o = state; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]]; o[parts[parts.length - 1]] = value; }
document.addEventListener('input', e => {
  const el = e.target; const b = el.dataset.bind; if (!b) return;
  setPath(b, el.value);
  const key = el.dataset.field;
  if (key) {
    const d = state.draft; const msg = document.getElementById('f-' + key + '-msg'); const wrap = document.getElementById('wrap-' + key);
    if (el.value.trim()) { if (d.errors[key]) { delete d.errors[key]; wrap.classList.remove('has-err'); el.removeAttribute('aria-invalid'); } msg.hidden = true; }
    if (!el.value.trim() && d.ai[key]) { delete d.ai[key]; const tag = document.getElementById('f-' + key + '-ai'); if (tag) tag.remove(); }
  }
  if (el.dataset.rerender) render();
});
document.addEventListener('focusout', e => {
  const el = e.target; const key = el.dataset && el.dataset.field; if (!key) return;
  const d = state.draft; if (el.value.trim()) return;
  d.touched[key] = true;
  const msg = document.getElementById('f-' + key + '-msg');
  if (msg && !d.errors[key]) { msg.className = 'msg hint'; msg.textContent = t('hint_' + key); msg.hidden = false; }
});
document.addEventListener('change', e => {
  const el = e.target; const c = el.dataset.change; if (!c) return;
  if (c === 'ai-off') { state.aiOff = el.checked; focusAfter = '#ai-off'; render(); }
  else if (c === 'mode') { state.listMode = el.value; focusAfter = '#mode-' + el.value; render(); }
  else if (c === 'followup') { state.followUp = el.checked; focusAfter = '#fu'; render(); }
  else if (c === 'files') { addFiles(el.files); el.value = ''; }
  else if (c === 'conf') { const f = state.draft.files.find(x => x.id === el.dataset.id); if (f) f.confidential = el.checked; }
  else if (c === 'translate') { state.translate[el.dataset.id] = el.value; focusAfter = '#tr-sel'; render(); }
  else if (c === 'markq') state.composer.question = el.checked;
  else if (c === 'orig') { state.modal.original = el.value; if (el.value && state.modal.errors.original) { delete state.modal.errors.original; focusAfter = '#cl-orig'; render(); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.menu) { const m = state.menu; state.menu = null; focusAfter = m === 'bell' ? '#btn-bell' : m === 'role' ? '#btn-role' : '#btn-status'; render(); }
    else if (state.modal) { const ret = state.modal.ret; state.modal = null; focusAfter = ret || null; render(); }
    return;
  }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('.menu, .pop-list')) {
    e.preventDefault();
    const items = Array.from(e.target.closest('.menu, .popover').querySelectorAll('.menu-item, .notif'));
    const i = items.indexOf(document.activeElement);
    const n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; if (n) n.focus();
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute('role') === 'tab') {
    const tab = state.composer.tab === 'public' ? 'internal' : 'public'; state.composer.tab = tab; focusAfter = '#tab-' + tab; render();
  }
  if (e.key === 'Tab' && state.modal) {
    const f = Array.from(document.querySelectorAll('.modal button, .modal textarea, .modal select, .modal input, .modal a[href]')).filter(x => !x.disabled);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-in') { e.preventDefault(); chatSend(); }
});
['dragover', 'dragleave', 'drop'].forEach(type => document.addEventListener(type, e => {
  const z = e.target.closest && e.target.closest('#dropzone'); if (!z) return;
  e.preventDefault();
  if (type === 'dragover') z.classList.add('over');
  else z.classList.remove('over');
  if (type === 'drop' && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
}));

render();
})();
</script>
